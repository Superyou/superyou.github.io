<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You Wu Homepage Preview</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e5e7eb; display: grid; min-height: 100vh; place-items: center; }
    main { width: min(880px, 92vw); padding: 56px 0; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 12px; }
    p { color: #cbd5e1; font-size: 1.1rem; line-height: 1.7; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 32px; }
    a { display: block; border: 1px solid rgba(148, 163, 184, .35); border-radius: 22px; padding: 24px; text-decoration: none; color: #f8fafc; background: rgba(15, 23, 42, .72); box-shadow: 0 18px 45px rgba(0,0,0,.25); }
    a:hover { transform: translateY(-2px); border-color: rgba(250, 204, 21, .8); }
    strong { font-size: 1.25rem; }
    span { display: block; margin-top: 10px; color: #94a3b8; }
    code { color: #fde68a; }
  </style>
</head>
<body>
  <main>
    <h1>You Wu Homepage Preview</h1>
    <p>This page is only for comparing both designs after deployment. Your public homepage at <code>/</code> currently uses the startup-minimal version.</p>
    <div class="cards">
      <a href="./startup-minimal/"><strong>Startup Minimal</strong><span>Clean, professional, investor/founder friendly.</span></a>
      <a href="./dark-tech/"><strong>Dark Tech</strong><span>More AI infrastructure / chip / systems visual style.</span></a>
    </div>
  </main>
</body>
</html>
